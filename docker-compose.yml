version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: iteam_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlbb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlbb_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-mlbb_esports}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlbb_user} -d ${POSTGRES_DB:-mlbb_esports}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Caching & Ready Check Engine
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: iteam_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. FastAPI REST API Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iteam_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"

  # ----------------------------------------------------------------------------
  # 4. Telegram Bot Daemon (aiogram 3.x)
  # ----------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iteam_bot
    restart: always
    command: ["python", "-m", "bot.bot"]
    depends_on:
      - backend
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:

